[package]
name = "oxpad"
version = "0.3.1"
edition = "2021"
description = "A simple Notepad-style text editor with terminal and GUI editions"
license = "MIT"
repository = "https://github.com/Visionxxx/oxpad"
readme = "README.md"
authors = ["Glenn Roar Høye <glenn.roar.hoye@gmail.com>"]

[[bin]]
name = "oxpad"
path = "main.rs"

[[bin]]
name = "oxpad-gui"
path = "gui.rs"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
crossterm = "0.27"
eframe = { version = "0.35.0", features = ["persistence"] }
egui_commonmark = "0.24.0"
rfd = "0.17.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dev-dependencies]
egui_kittest = { version = "0.35", default-features = false }

[build-dependencies]
winresource = "0.1.31"

# Debian/Ubuntu package (built with `cargo deb`)
[package.metadata.deb]
maintainer = "Glenn Roar Høye <glenn.roar.hoye@gmail.com>"
copyright = "2026 Glenn Roar Høye"
extended-description = """A lightweight Notepad-style text editor written in Rust. \
Includes a GUI edition (oxpad-gui) with find & replace, line numbers, \
Markdown preview, themes and session persistence, plus a terminal edition (oxpad)."""
section = "editors"
priority = "optional"
assets = [
    ["target/release/oxpad", "usr/bin/", "755"],
    ["target/release/oxpad-gui", "usr/bin/", "755"],
    ["assets/oxpad.desktop", "usr/share/applications/", "644"],
    ["assets/oxpad.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/oxpad-48.png", "usr/share/icons/hicolor/48x48/apps/oxpad.png", "644"],
    ["assets/oxpad-64.png", "usr/share/icons/hicolor/64x64/apps/oxpad.png", "644"],
    ["assets/oxpad-128.png", "usr/share/icons/hicolor/128x128/apps/oxpad.png", "644"],
    ["assets/oxpad-256.png", "usr/share/icons/hicolor/256x256/apps/oxpad.png", "644"],
    ["LICENSE", "usr/share/doc/oxpad/", "644"],
    ["README.md", "usr/share/doc/oxpad/", "644"],
]
